name: Host Monitor

on:
  workflow_dispatch:

  schedule:
    # Hər 2 gündən bir
    - cron: "17 2 */2 * *"

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Host scanner
        env:
          TELEGRAM_TOKEN: "8811650010:AAF3qAKekoObZInM2NQavrc4YfnakHUBF7A"
          CHAT_ID: "1436101177"
        run: |
          cat > /tmp/scanner.py <<'PY'
          import requests
          import os
          from datetime import datetime, timezone

          TOKEN = os.environ["TELEGRAM_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          DOMAINS = [
              "nar.az",
              "azercell.com"
          ]

          CACHE = "hosts_cache.txt"

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          def telegram(text):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              try:
                  r = requests.post(
                      url,
                      data={
                          "chat_id": CHAT_ID,
                          "text": text
                      },
                      timeout=20
                  )

                  print("Telegram:", r.status_code)

                  if not r.ok:
                      print(r.text)

              except Exception as e:
                  print("Telegram xətası:", e)


          def normalize(value, domain):
              value = value.strip().lower().rstrip(".")

              if value.startswith("*."):
                  value = value[2:]

              if value == domain or value.endswith("." + domain):
                  return value

              return None


          def get_crtsh(domain):
              result = set()

              try:
                  url = f"https://crt.sh/?q=%25.{domain}&output=json"

                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  if r.status_code == 200:

                      for item in r.json():

                          names = item.get(
                              "name_value",
                              ""
                          )

                          for name in names.splitlines():

                              host = normalize(
                                  name,
                                  domain
                              )

                              if host:
                                  result.add(host)

              except Exception as e:
                  print("crt.sh:", e)

              return result


          def get_hackertarget(domain):
              result = set()

              try:
                  url = (
                      "https://api.hackertarget.com/"
                      f"hostsearch/?q={domain}"
                  )

                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  if r.status_code == 200:

                      for line in r.text.splitlines():

                          if "," not in line:
                              continue

                          host = line.split(
                              ",",
                              1
                          )[0]

                          host = normalize(
                              host,
                              domain
                          )

                          if host:
                              result.add(host)

              except Exception as e:
                  print(
                      "HackerTarget:",
                      e
                  )

              return result


          def get_alienvault(domain):
              result = set()

              try:
                  url = (
                      "https://otx.alienvault.com/"
                      "api/v1/indicators/domain/"
                      f"{domain}/passive_dns"
                  )

                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  if r.status_code == 200:

                      data = r.json()

                      for item in data.get(
                          "passive_dns",
                          []
                      ):

                          host = normalize(
                              item.get(
                                  "hostname",
                                  ""
                              ),
                              domain
                          )

                          if host:
                              result.add(host)

              except Exception as e:
                  print(
                      "AlienVault:",
                      e
                  )

              return result


          def get_anubis(domain):
              result = set()

              try:
                  url = (
                      "https://jldc.me/anubis/"
                      f"subdomains/{domain}"
                  )

                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  if r.status_code == 200:

                      data = r.json()

                      if isinstance(data, list):

                          for name in data:

                              host = normalize(
                                  name,
                                  domain
                              )

                              if host:
                                  result.add(host)

              except Exception as e:
                  print("Anubis:", e)

              return result


          def load_cache():

              if not os.path.exists(CACHE):
                  return set()

              try:

                  with open(
                      CACHE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return {
                          line.strip().lower()
                          for line in f
                          if line.strip()
                      }

              except Exception:
                  return set()


          def save_cache(hosts):

              with open(
                  CACHE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for host in sorted(hosts):
                      f.write(host + "\n")


          def send_chunks(lines):

              message = "\n".join(lines)

              while message:

                  if len(message) <= 3800:
                      part = message
                      message = ""

                  else:

                      cut = message.rfind(
                          "\n",
                          0,
                          3800
                      )

                      if cut <= 0:
                          cut = 3800

                      part = message[:cut]
                      message = message[cut:].lstrip()

                  telegram(part)


          def main():

              print("=" * 50)
              print("HOST MONITOR BAŞLADI")
              print("=" * 50)

              current = set()

              for domain in DOMAINS:

                  print(
                      f"[+] {domain} yoxlanılır"
                  )

                  current.update(
                      get_crtsh(domain)
                  )

                  current.update(
                      get_hackertarget(domain)
                  )

                  current.update(
                      get_alienvault(domain)
                  )

                  current.update(
                      get_anubis(domain)
                  )

              old = load_cache()

              new = current - old

              now = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%d %H:%M UTC"
              )

              print(
                  "Ümumi:",
                  len(current)
              )

              print(
                  "Yeni:",
                  len(new)
              )

              # Telegram hesabatı
              lines = [
                  "🔎 HOST MONITOR",
                  f"🕐 {now}",
                  "",
                  f"📊 Ümumi host/subdomain: {len(current)}",
                  f"🆕 Yeni: {len(new)}",
                  ""
              ]

              if new:

                  lines.append(
                      "🆕 YENİ TAPILANLAR:"
                  )

                  for host in sorted(new):
                      lines.append(
                          f"• {host}"
                      )

                  lines.append("")

              lines.append(
                  "📋 BÜTÜN TAPILAN HOSTLAR:"
              )

              for host in sorted(current):
                  lines.append(
                      f"• {host}"
                  )

              send_chunks(lines)

              save_cache(current)

              print(
                  "[+] Hesabat göndərildi"
              )


          main()
          PY

          python /tmp/scanner.py

      - name: Cache yadda saxla
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f hosts_cache.txt ]; then
            git add hosts_cache.txt

            if git diff --cached --quiet; then
              echo "Cache dəyişməyib."
            else
              git commit -m "Update host cache"
              git push
            fi
          fi
