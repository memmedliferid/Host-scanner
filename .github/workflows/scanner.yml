name: Subdomain Scanner

on:
  schedule:
    - cron: "17 2 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:

      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Requests
        run: |
          pip install requests

      - name: Scanner
        run: |
          python scanner.py

      - name: Cache yadda saxla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hosts_cache.txt

          git diff --cached --quiet || \
          git commit -m "Update subdomain cache"

          git push
