name: Host Scanner Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 */2 * *'  # Hər 2 gündən bir avtomatik yoxlayır

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Repository-ni yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kitabxanaları yüklə
        run: pip install requests

      - name: Skripti işə sal
        run: python super_scanner.py

      - name: Bazanı yenilə və yadda saxla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts_cache.txt
          git diff --staged --quiet || git commit -m "Update hosts cache [skip ci]"
          git push
          
