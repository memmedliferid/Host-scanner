name: scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 */2 * *"

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:

      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: scanner.py tap
        run: |
          echo "scanner.py axtarılır..."
          
          FILE=$(find . -type f -iname "scanner.py" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "XƏTA: scanner.py repository-də tapılmadı!"
            echo "Repository faylları:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Tapıldı: $FILE"
          python "$FILE"

      - name: Cache yadda saxla
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f hosts_cache.txt ]; then
            git add hosts_cache.txt

            if git diff --cached --quiet; then
              echo "Yeni cache dəyişiklik yoxdur."
            else
              git commit -m "Update subdomain cache"
              git push
            fi
          else
            echo "hosts_cache.txt yaradılmayıb."
          fi
